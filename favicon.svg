<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Blue brand background -->
  <circle cx="16" cy="16" r="16" fill="#1D4ED8"/>
  <!-- White ball -->
  <circle cx="16" cy="16" r="10.5" fill="white"/>
  <!-- Soccer ball patches (classic black hexagon pattern) -->
  <!-- Centre pentagon -->
  <polygon points="16,10.5 19.6,12.9 18.3,17 13.7,17 12.4,12.9" fill="#1e293b"/>
  <!-- Top -->
  <polygon points="16,5.5 19.2,8.2 16,10.5 12.8,8.2" fill="#1e293b"/>
  <!-- Bottom -->
  <polygon points="16,26.5 12.8,23.8 13.7,21 18.3,21 19.2,23.8" fill="#1e293b"/>
  <!-- Top-right -->
  <polygon points="24.5,12 22,10.5 19.6,12.9 21,16.5 25,15" fill="#1e293b"/>
  <!-- Top-left -->
  <polygon points="7.5,12 11,15 12.4,12.9 10,10.5" fill="#1e293b"/>
  <!-- Bottom-right -->
  <polygon points="25,17 21,17.5 19.2,23.8 22.5,21" fill="#1e293b"/>
  <!-- Bottom-left -->
  <polygon points="7,17 9.5,21 12.8,23.8 11,17.5" fill="#1e293b"/>
  <!-- Ball outline -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
</svg>
